test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# Use bin/rails credentials:edit to set the AWS secrets (as aws:access_key_id|secret_access_key)
# amazon:
#   service: S3
#   access_key_id: <%= Rails.application.credentials.dig(:aws, :access_key_id) %>
#   secret_access_key: <%= Rails.application.credentials.dig(:aws, :secret_access_key) %>
#   region: us-east-1
#   bucket: your_own_bucket-<%= Rails.env %>

# A7 — durable KYC image storage in production. On Cloud Run the attached runtime
# service account supplies Application Default Credentials, so NO keyfile is
# committed or needed (do not add a `credentials:` line). Enabled by setting
# ACTIVE_STORAGE_SERVICE=google (see config/environments/production.rb) once the
# bucket exists and the runtime SA has objectAdmin on it (scripts/setup-gcs.sh).
google:
  service: GCS
  project: <%= ENV["GCS_PROJECT"] %>
  bucket: <%= ENV["GCS_BUCKET"] %>
  # ADC (the Cloud Run runtime SA) has NO local private key, so blob URLs must be
  # signed via the IAM SignBlob API. Without `iam: true` the KYC image redirects
  # raise SignedUrlUnavailable (HTTP 500). Requires roles/iam.serviceAccountTokenCreator
  # on the runtime SA — granted by scripts/setup-gcs.sh.
  iam: true

