steps:
  # -----------------------------
  # Pull previous image (for cache)
  # -----------------------------
  - name: gcr.io/cloud-builders/docker
    id: Pull
    entrypoint: /bin/bash
    args:
      - -c
      - |
        docker pull $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:latest || exit 0

  # -----------------------------
  # Build image (BuildKit enabled)
  # -----------------------------
  - name: gcr.io/cloud-builders/docker
    id: Build
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - --cache-from=$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:latest
      - -t
      - $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
      - -t
      - $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:latest
      - -f
      - Dockerfile
      - .

  # -----------------------------
  # Push image
  # -----------------------------
  - name: gcr.io/cloud-builders/docker
    id: Push
    args:
      - push
      - --all-tags
      - $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME

  # -----------------------------
  # Run database migrations
  # -----------------------------
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: Migrate
    entrypoint: /bin/bash
    args:
      - -c
      - |
        gcloud run jobs deploy ${_SERVICE_NAME}-migrate \
          --image=$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA \
          --region=$_DEPLOY_REGION \
          --service-account=${_RUNTIME_SERVICE_ACCOUNT} \
          --command=/app/bin/deploy-migrate \
          --args=exec,rails,db:migrate \
          --max-retries=0 \
          --parallelism=1 \
          --tasks=1 \
          --task-timeout=900s \
          --set-env-vars=RAILS_ENV=production,RAILS_SERVE_STATIC_FILES=true,APP_URL=${_APP_URL},MAILER_FROM=${_MAILER_FROM},FIREBASE_API_KEY=${_FIREBASE_API_KEY},FIREBASE_AUTH_DOMAIN=${_FIREBASE_AUTH_DOMAIN},FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID},FIREBASE_STORAGE_BUCKET=${_FIREBASE_STORAGE_BUCKET},FIREBASE_MESSAGING_SENDER_ID=${_FIREBASE_MESSAGING_SENDER_ID},FIREBASE_APP_ID=${_FIREBASE_APP_ID},FIREBASE_MEASUREMENT_ID=${_FIREBASE_MEASUREMENT_ID},FIREBASE_WEB_VAPID_KEY=${_FIREBASE_WEB_VAPID_KEY},PLATE_RECOGNIZER_REGION=${_PLATE_RECOGNIZER_REGION},PLATE_RECOGNIZER_API_URL=${_PLATE_RECOGNIZER_API_URL},RELEASE_SHA=$COMMIT_SHA \
          --set-secrets=SECRET_KEY_BASE=fuel-loyalty-secret-key-base:latest,DATABASE_URL=fuel-loyalty-database-url:latest,ADMIN_NOTIFICATION_API_TOKEN=fuel-loyalty-admin-notification-api-token:latest,PLATE_RECOGNIZER_API_TOKEN=fuel-loyalty-plate-recognizer-api-token:latest \
          --quiet

        gcloud run jobs execute ${_SERVICE_NAME}-migrate \
          --region=$_DEPLOY_REGION \
          --wait \
          --quiet

  # -----------------------------
  # Deploy to Cloud Run
  # -----------------------------
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: Deploy
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - $_SERVICE_NAME
      - --image=$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
      - --region=$_DEPLOY_REGION
      - --platform=managed
      - --service-account=$_RUNTIME_SERVICE_ACCOUNT
      - --quiet

      # Runtime configuration (non-secret env vars)
      - --set-env-vars=RAILS_ENV=production,RAILS_SERVE_STATIC_FILES=true,APP_URL=${_APP_URL},MAILER_FROM=${_MAILER_FROM},FIREBASE_API_KEY=${_FIREBASE_API_KEY},FIREBASE_AUTH_DOMAIN=${_FIREBASE_AUTH_DOMAIN},FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID},FIREBASE_STORAGE_BUCKET=${_FIREBASE_STORAGE_BUCKET},FIREBASE_MESSAGING_SENDER_ID=${_FIREBASE_MESSAGING_SENDER_ID},FIREBASE_APP_ID=${_FIREBASE_APP_ID},FIREBASE_MEASUREMENT_ID=${_FIREBASE_MEASUREMENT_ID},FIREBASE_WEB_VAPID_KEY=${_FIREBASE_WEB_VAPID_KEY},PLATE_RECOGNIZER_REGION=${_PLATE_RECOGNIZER_REGION},PLATE_RECOGNIZER_API_URL=${_PLATE_RECOGNIZER_API_URL},RELEASE_SHA=$COMMIT_SHA

      # Secrets sourced from Secret Manager (values never appear in this file or build logs)
      - --set-secrets=SECRET_KEY_BASE=fuel-loyalty-secret-key-base:latest,DATABASE_URL=fuel-loyalty-database-url:latest,ADMIN_NOTIFICATION_API_TOKEN=fuel-loyalty-admin-notification-api-token:latest,PLATE_RECOGNIZER_API_TOKEN=fuel-loyalty-plate-recognizer-api-token:latest


      # Labels (traceability)
      - --update-labels=managed-by=gcp-cloud-build-deploy-cloud-run,gcb-trigger-id=$_TRIGGER_ID,gcb-trigger-region=$LOCATION,commit-sha=$COMMIT_SHA,gcb-build-id=$BUILD_ID

images:
  - $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
  - $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:latest

options:
  requestedVerifyOption: VERIFIED
  substitutionOption: ALLOW_LOOSE
  logging: CLOUD_LOGGING_ONLY

