steps:
  # -----------------------------
  # Compile the Android app (Kotlin type check)
  # -----------------------------
  # Runs here rather than in GitHub Actions: the Actions workflow never once
  # obtained a runner (no runner assigned, ~2s failures, every run since it was
  # created), while this pipeline demonstrably works.
  #
  # Starts immediately, in parallel with Pull/Build/Push, so it costs little
  # wall-clock; Migrate waits on it, so a Kotlin break stops the pipeline BEFORE
  # anything is migrated or deployed.
  #
  # The real google-services.json is per-environment Firebase config and is
  # gitignored, so no checkout has one — and :app:processDebugGoogleServices
  # gates :app:compileDebugKotlin. Type checking needs a file that parses, not
  # one that addresses a live project, hence the checked-in placeholder.
  - name: eclipse-temurin:17-jdk
    id: AndroidCompile
    entrypoint: /bin/bash
    waitFor: ['-']
    args:
      - -c
      - |
        set -euo pipefail
        apt-get update -qq && apt-get install -y -qq --no-install-recommends curl unzip >/dev/null

        export ANDROID_HOME=/workspace/.android-sdk
        export ANDROID_SDK_ROOT="$$ANDROID_HOME"
        mkdir -p "$$ANDROID_HOME/cmdline-tools"
        curl -sSL -o /tmp/cmdline-tools.zip \
          https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q /tmp/cmdline-tools.zip -d "$$ANDROID_HOME/cmdline-tools"
        mv "$$ANDROID_HOME/cmdline-tools/cmdline-tools" "$$ANDROID_HOME/cmdline-tools/latest"
        export PATH="$$ANDROID_HOME/cmdline-tools/latest/bin:$$PATH"

        yes | sdkmanager --licenses >/dev/null 2>&1 || true
        sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" >/dev/null

        cp android/ci-google-services.json android/app/google-services.json
        cd android
        ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace

  # -----------------------------
  # Pull previous image (for cache)
  # -----------------------------
  - name: gcr.io/cloud-builders/docker
    id: Pull
    entrypoint: /bin/bash
    waitFor: ['-']
    args:
      - -c
      - |
        docker pull $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:latest || exit 0

  # -----------------------------
  # Build image (BuildKit enabled)
  # -----------------------------
  - name: gcr.io/cloud-builders/docker
    id: Build
    waitFor: ['Pull']
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - --cache-from=$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:latest
      - -t
      - $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
      - -t
      - $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:latest
      - -f
      - Dockerfile
      - .

  # -----------------------------
  # Push image
  # -----------------------------
  - name: gcr.io/cloud-builders/docker
    id: Push
    waitFor: ['Build']
    args:
      - push
      - --all-tags
      - $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME

  # -----------------------------
  # Run database migrations
  # -----------------------------
  # Gated on AndroidCompile as well as Push: nothing reaches the database or the
  # running service until the Kotlin type-checks.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: Migrate
    waitFor: ['Push', 'AndroidCompile']
    entrypoint: /bin/bash
    args:
      - -c
      - |
        gcloud run jobs deploy ${_SERVICE_NAME}-migrate \
          --image=$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA \
          --region=$_DEPLOY_REGION \
          --service-account=${_RUNTIME_SERVICE_ACCOUNT} \
          --command=/app/bin/deploy-migrate \
          --args=exec,rails,db:migrate \
          --max-retries=0 \
          --parallelism=1 \
          --tasks=1 \
          --task-timeout=900s \
          --set-env-vars=RAILS_ENV=production,RAILS_SERVE_STATIC_FILES=true,APP_URL=${_APP_URL},MAILER_FROM=${_MAILER_FROM},FIREBASE_API_KEY=${_FIREBASE_API_KEY},FIREBASE_AUTH_DOMAIN=${_FIREBASE_AUTH_DOMAIN},FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID},FIREBASE_STORAGE_BUCKET=${_FIREBASE_STORAGE_BUCKET},FIREBASE_MESSAGING_SENDER_ID=${_FIREBASE_MESSAGING_SENDER_ID},FIREBASE_APP_ID=${_FIREBASE_APP_ID},FIREBASE_MEASUREMENT_ID=${_FIREBASE_MEASUREMENT_ID},FIREBASE_WEB_VAPID_KEY=${_FIREBASE_WEB_VAPID_KEY},PLATE_RECOGNIZER_REGION=${_PLATE_RECOGNIZER_REGION},PLATE_RECOGNIZER_API_URL=${_PLATE_RECOGNIZER_API_URL},ACTIVE_STORAGE_SERVICE=${_ACTIVE_STORAGE_SERVICE},GCS_PROJECT=${_GCS_PROJECT},GCS_BUCKET=${_GCS_BUCKET},RELEASE_SHA=$COMMIT_SHA \
          --set-secrets=SECRET_KEY_BASE=fuel-loyalty-secret-key-base:latest,DATABASE_URL=fuel-loyalty-database-url:latest,ADMIN_NOTIFICATION_API_TOKEN=fuel-loyalty-admin-notification-api-token:latest,PLATE_RECOGNIZER_API_TOKEN=fuel-loyalty-plate-recognizer-api-token:latest,AR_ENCRYPTION_PRIMARY_KEY=fuel-loyalty-ar-encryption-primary-key:latest,AR_ENCRYPTION_DETERMINISTIC_KEY=fuel-loyalty-ar-encryption-deterministic-key:latest,AR_ENCRYPTION_KEY_DERIVATION_SALT=fuel-loyalty-ar-encryption-key-derivation-salt:latest \
          --quiet

        gcloud run jobs execute ${_SERVICE_NAME}-migrate \
          --region=$_DEPLOY_REGION \
          --wait \
          --quiet

  # -----------------------------
  # Deploy to Cloud Run
  # -----------------------------
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: Deploy
    waitFor: ['Migrate']
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - $_SERVICE_NAME
      - --image=$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
      - --region=$_DEPLOY_REGION
      - --platform=managed
      - --service-account=$_RUNTIME_SERVICE_ACCOUNT
      - --quiet

      # Runtime configuration (non-secret env vars)
      - --set-env-vars=RAILS_ENV=production,RAILS_SERVE_STATIC_FILES=true,APP_URL=${_APP_URL},MAILER_FROM=${_MAILER_FROM},FIREBASE_API_KEY=${_FIREBASE_API_KEY},FIREBASE_AUTH_DOMAIN=${_FIREBASE_AUTH_DOMAIN},FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID},FIREBASE_STORAGE_BUCKET=${_FIREBASE_STORAGE_BUCKET},FIREBASE_MESSAGING_SENDER_ID=${_FIREBASE_MESSAGING_SENDER_ID},FIREBASE_APP_ID=${_FIREBASE_APP_ID},FIREBASE_MEASUREMENT_ID=${_FIREBASE_MEASUREMENT_ID},FIREBASE_WEB_VAPID_KEY=${_FIREBASE_WEB_VAPID_KEY},PLATE_RECOGNIZER_REGION=${_PLATE_RECOGNIZER_REGION},PLATE_RECOGNIZER_API_URL=${_PLATE_RECOGNIZER_API_URL},ACTIVE_STORAGE_SERVICE=${_ACTIVE_STORAGE_SERVICE},GCS_PROJECT=${_GCS_PROJECT},GCS_BUCKET=${_GCS_BUCKET},RELEASE_SHA=$COMMIT_SHA

      # Secrets sourced from Secret Manager (values never appear in this file or build logs).
      # The AR_ENCRYPTION_* keys back A7 Aadhaar-at-rest — the app FAILS TO BOOT
      # without them, so create them (scripts/setup-encryption-keys.sh) before the
      # first deploy that includes the A7 encryption initializer.
      - --set-secrets=SECRET_KEY_BASE=fuel-loyalty-secret-key-base:latest,DATABASE_URL=fuel-loyalty-database-url:latest,ADMIN_NOTIFICATION_API_TOKEN=fuel-loyalty-admin-notification-api-token:latest,PLATE_RECOGNIZER_API_TOKEN=fuel-loyalty-plate-recognizer-api-token:latest,AR_ENCRYPTION_PRIMARY_KEY=fuel-loyalty-ar-encryption-primary-key:latest,AR_ENCRYPTION_DETERMINISTIC_KEY=fuel-loyalty-ar-encryption-deterministic-key:latest,AR_ENCRYPTION_KEY_DERIVATION_SALT=fuel-loyalty-ar-encryption-key-derivation-salt:latest


      # Labels (traceability)
      - --update-labels=managed-by=gcp-cloud-build-deploy-cloud-run,gcb-trigger-id=$_TRIGGER_ID,gcb-trigger-region=$LOCATION,commit-sha=$COMMIT_SHA,gcb-build-id=$BUILD_ID

images:
  - $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
  - $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:latest

options:
  requestedVerifyOption: VERIFIED
  substitutionOption: ALLOW_LOOSE
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _TRIGGER_ID: ad281931-7075-4970-a527-68cd5ab9de7f
  _DEPLOY_REGION: us-central1
  _AR_HOSTNAME: us-central1-docker.pkg.dev
  _AR_REPOSITORY: cloud-run-source-deploy
  _AR_PROJECT_ID: thoughtbasics
  _SERVICE_NAME: fuel-loyalty-git
  REPO_NAME: achalbi-fuel-loyalty
  _APP_URL: 'https://fly.thoughtbasics.com'
  _MAILER_FROM: 'no-reply@fly.thoughtbasics.com'
  _FIREBASE_API_KEY: 'AIzaSyD2GOiEjnrGWDPQt1chym04qtmQ3F5LCEQ'
  _FIREBASE_AUTH_DOMAIN: 'fuel-loyalty.firebaseapp.com'
  _FIREBASE_PROJECT_ID: 'fuel-loyalty'
  _FIREBASE_STORAGE_BUCKET: 'fuel-loyalty.firebasestorage.app'
  _FIREBASE_MESSAGING_SENDER_ID: '629935221011'
  _FIREBASE_APP_ID: '1:629935221011:web:612bdd301126b28e8492e6'
  _FIREBASE_MEASUREMENT_ID: 'G-K2Q0927ZJX'
  _FIREBASE_WEB_VAPID_KEY: 'BM7ZYF-Ye-YL6sc9q7Te0wPoB_QMeTKrg_FCS6zoESZnK-3m8hRcT333tC-gC17dx3Yzfo5B-4XYU-NE1WIsVoE'
  _PLATE_RECOGNIZER_REGION: 'in'
  _PLATE_RECOGNIZER_API_URL: 'https://api.platerecognizer.com/v1/plate-reader/'

  # A7 durable KYC storage. Defaults keep uploads on the ephemeral local disk so a
  # deploy still boots before GCS is provisioned. After running
  # scripts/setup-gcs.sh, flip _ACTIVE_STORAGE_SERVICE to 'google' and set
  # _GCS_BUCKET so operator KYC images survive Cloud Run restarts.
  _ACTIVE_STORAGE_SERVICE: 'google'
  _GCS_PROJECT: 'thoughtbasics'
  _GCS_BUCKET: 'fuel-loyalty-uploads'

  # Secrets (SECRET_KEY_BASE, DATABASE_URL, ADMIN_NOTIFICATION_API_TOKEN,
  # PLATE_RECOGNIZER_API_TOKEN) are NOT stored here. They live in Secret Manager
  # and are mounted at runtime via --set-secrets in the Migrate and Deploy steps.
  # See scripts/setup-secrets.sh to create/rotate them.

tags:
  - gcp-cloud-build-deploy-cloud-run
  - fuel-loyalty-git
