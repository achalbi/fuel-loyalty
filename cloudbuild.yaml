steps:
  # -----------------------------
  # Ensure the Android SDK cache bucket exists
  # -----------------------------
  # Self-provisioning so the cache needs no manual setup step before it starts
  # paying off. Runs in parallel with everything else and is off the critical
  # path — only AndroidCacheSave waits on it.
  #
  # No IAM grant here: whatever role lets this service account create a bucket
  # already carries object access to it. If the account cannot create buckets,
  # the step says so and exits 0 — every build then installs the SDK from
  # scratch, exactly as it did before any of this existed.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: BuildCacheBucket
    entrypoint: /bin/bash
    waitFor: ['-']
    args:
      - -c
      - |
        if gcloud storage buckets describe "gs://${_BUILD_CACHE_BUCKET}" >/dev/null 2>&1; then
          echo "cache bucket ready -> gs://${_BUILD_CACHE_BUCKET}"
          exit 0
        fi

        echo "cache bucket missing — creating gs://${_BUILD_CACHE_BUCKET}"
        if ! gcloud storage buckets create "gs://${_BUILD_CACHE_BUCKET}" \
            --project="$PROJECT_ID" \
            --location="${_DEPLOY_REGION}" \
            --uniform-bucket-level-access \
            --public-access-prevention; then
          echo "could not create the cache bucket (no permission?) — builds still work, just slower"
          exit 0
        fi

        # Expire cache objects so stale SDK archives cannot accumulate cost
        # forever. A miss just means one slower build that repopulates it.
        printf '%s' \
          '{"lifecycle":{"rule":[{"action":{"type":"Delete"},"condition":{"age":30}}]}}' \
          > /tmp/lifecycle.json
        gcloud storage buckets update "gs://${_BUILD_CACHE_BUCKET}" \
          --lifecycle-file=/tmp/lifecycle.json >/dev/null \
          && echo "created the cache bucket with a 30-day object expiry" \
          || echo "created the cache bucket, but could not set the expiry — objects will not auto-expire"
        exit 0

  # -----------------------------
  # Restore the cached Android SDK
  # -----------------------------
  # Best-effort: a cache miss, a missing bucket or no GCS permission all fall
  # through to a fresh install in the next step. Caching must never be able to
  # fail a deploy, so this step always exits 0.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: AndroidCacheRestore
    entrypoint: /bin/bash
    waitFor: ['-']
    args:
      - -c
      - |
        echo miss > /workspace/.android-sdk-cache
        if gcloud storage cp "gs://${_BUILD_CACHE_BUCKET}/${_ANDROID_SDK_CACHE_KEY}" /workspace/sdk.tgz 2>/dev/null; then
          if tar -xzf /workspace/sdk.tgz -C /workspace; then
            echo hit > /workspace/.android-sdk-cache
            echo "ANDROID SDK CACHE: HIT - restored from gs://${_BUILD_CACHE_BUCKET}/${_ANDROID_SDK_CACHE_KEY}"
          else
            # tar writes files before it fails, so a truncated archive leaves a
            # half-extracted tree behind. Remove it: the marker must describe
            # what is actually on disk, or the compile step's recovery logic
            # reasons about state that is not there.
            echo "ANDROID SDK CACHE: CORRUPT - discarding the partial extraction"
            rm -rf /workspace/android-sdk
          fi
          rm -f /workspace/sdk.tgz
        else
          echo "ANDROID SDK CACHE: MISS - the compile step will install one"
        fi

        # Gradle's downloaded dependencies and the wrapper distribution. Keyed
        # by a hash of every file that can change what gets resolved, so a
        # dependency bump misses instead of silently reusing the wrong jars --
        # no manual key to remember to bump, unlike the SDK key above.
        GRADLE_KEY="gradle-deps-$$(find android \
            \( -name 'build.gradle.kts' -o -name 'settings.gradle.kts' \
               -o -name 'libs.versions.toml' -o -name 'gradle-wrapper.properties' \
               -o -name 'gradle.properties' \) -type f \
          | sort | xargs sha256sum | sha256sum | cut -c1-16).tar"
        echo "$$GRADLE_KEY" > /workspace/.gradle-cache-key

        # Stored uncompressed on purpose: it is almost entirely jars, which are
        # already deflated, so gzip buys a few percent for real CPU time -- and
        # the decompress would land on the critical path, unlike the upload.
        echo miss > /workspace/.gradle-cache
        if gcloud storage cp "gs://${_BUILD_CACHE_BUCKET}/$$GRADLE_KEY" /workspace/gradle.tar 2>/dev/null; then
          if tar -xf /workspace/gradle.tar -C /workspace; then
            echo hit > /workspace/.gradle-cache
            echo "GRADLE CACHE: HIT - restored gs://${_BUILD_CACHE_BUCKET}/$$GRADLE_KEY"
          else
            # As above: without this the marker says "miss" while a poisoned
            # gradle home sits on disk, so AndroidCompile's retry-from-clean
            # never fires and the step exits 1 -- blocking the deploy, and
            # blocking the save step that would have replaced the bad object.
            echo "GRADLE CACHE: CORRUPT - discarding the partial extraction"
            rm -rf /workspace/gradle-home
          fi
          rm -f /workspace/gradle.tar
        else
          echo "GRADLE CACHE: MISS - gradle will resolve dependencies from the network"
        fi
        exit 0

  # -----------------------------
  # Compile the Android app (Kotlin type check)
  # -----------------------------
  # Runs here rather than in GitHub Actions: the Actions workflow never once
  # obtained a runner (no runner assigned, ~2s failures, every run since it was
  # created), while this pipeline demonstrably works.
  #
  # Starts as early as the cache restore allows, in parallel with
  # Pull/Build/Push, so it costs little wall-clock; Migrate waits on it, so a
  # Kotlin break stops the pipeline BEFORE anything is migrated or deployed.
  #
  # The real google-services.json is per-environment Firebase config and is
  # gitignored, so no checkout has one — and :app:processDebugGoogleServices
  # gates :app:compileDebugKotlin. Type checking needs a file that parses, not
  # one that addresses a live project, hence the checked-in placeholder.
  - name: eclipse-temurin:17-jdk
    id: AndroidCompile
    entrypoint: /bin/bash
    waitFor: ['AndroidCacheRestore']
    args:
      - -c
      - |
        set -euo pipefail
        export ANDROID_HOME=/workspace/android-sdk
        export ANDROID_SDK_ROOT="$$ANDROID_HOME"

        # One list drives both the completeness check and the install, so the
        # two can never disagree. A package id maps to its install directory by
        # swapping ';' for '/' (platforms;android-36 -> platforms/android-36).
        SDK_PACKAGES="platform-tools platforms;android-36 build-tools;36.0.0"

        # Checking only for sdkmanager would accept a cache that has the tools
        # but is missing a package -- e.g. someone bumps a package below and
        # forgets to bump _ANDROID_SDK_CACHE_KEY. Gradle would then fail and,
        # because Migrate waits on this step, a stale cache would block the
        # deploy. Verify what the build actually needs instead.
        NEED_INSTALL=0
        [ -x "$$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ] || NEED_INSTALL=1
        for pkg in $$SDK_PACKAGES; do
          [ -e "$$ANDROID_HOME/$$(printf '%s' "$$pkg" | tr ';' '/')" ] || NEED_INSTALL=1
        done

        if [ "$$NEED_INSTALL" = 1 ]; then
          if [ -e "$$ANDROID_HOME" ]; then
            echo "ANDROID SDK CACHE: INCOMPLETE - reinstalling and replacing the cached archive"
            # Start clean so a partial cache cannot confuse the install below,
            # and mark it a miss so AndroidCacheSave overwrites the bad archive
            # rather than leaving every future build to hit the same problem.
            rm -rf "$$ANDROID_HOME"
            echo miss > /workspace/.android-sdk-cache
          fi
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends curl unzip >/dev/null
          mkdir -p "$$ANDROID_HOME/cmdline-tools"
          curl -sSL -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "$$ANDROID_HOME/cmdline-tools"
          mv "$$ANDROID_HOME/cmdline-tools/cmdline-tools" "$$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$$ANDROID_HOME/cmdline-tools/latest/bin:$$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager $$SDK_PACKAGES >/dev/null
        else
          echo "ANDROID SDK CACHE: USING RESTORED SDK - skipped the ~250MB download"
        fi

        cp android/ci-google-services.json android/app/google-services.json

        # Must live under /workspace: the cache steps run in a different
        # container, and only /workspace is shared between steps.
        export GRADLE_USER_HOME=/workspace/gradle-home

        cd android
        if ! ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace; then
          # A corrupt restored cache must not be able to fail the deploy -- the
          # same rule the SDK follows. Retry once from clean, and only report
          # failure if the build is broken without any cache in play. Marked a
          # miss so the save step replaces the bad archive.
          if [ "$$(cat /workspace/.gradle-cache 2>/dev/null)" = "hit" ]; then
            echo "GRADLE CACHE: compile failed on a restored cache - retrying from clean"
            rm -rf "$$GRADLE_USER_HOME"
            echo miss > /workspace/.gradle-cache
            ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace
          else
            exit 1
          fi
        fi

  # -----------------------------
  # Save the Android SDK to the cache
  # -----------------------------
  # Only on a miss, and only after the compile proved the SDK is usable. Like
  # the restore, it can never fail the build.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: AndroidCacheSave
    entrypoint: /bin/bash
    waitFor: ['AndroidCompile', 'BuildCacheBucket']
    args:
      - -c
      - |
        # Gradle first: the SDK check below exits early on a hit, and these two
        # caches miss independently.
        if [ "$$(cat /workspace/.gradle-cache 2>/dev/null)" = "hit" ]; then
          echo "GRADLE CACHE: already warm - nothing to upload"
        else
          GRADLE_KEY="$$(cat /workspace/.gradle-cache-key 2>/dev/null)"
          GRADLE_PATHS=""
          for d in gradle-home/caches/modules-2 gradle-home/wrapper/dists; do
            [ -d "/workspace/$$d" ] && GRADLE_PATHS="$$GRADLE_PATHS $$d"
          done
          if [ -n "$$GRADLE_KEY" ] && [ -n "$$GRADLE_PATHS" ]; then
            tar -cf /workspace/gradle.tar -C /workspace $$GRADLE_PATHS \
              && gcloud storage cp /workspace/gradle.tar "gs://${_BUILD_CACHE_BUCKET}/$$GRADLE_KEY" \
              && echo "GRADLE CACHE: SAVED for the next build" \
              || echo "GRADLE CACHE: could not write - builds still work, just slower"
          else
            echo "GRADLE CACHE: nothing to save"
          fi
        fi

        if [ "$$(cat /workspace/.android-sdk-cache 2>/dev/null)" = "hit" ]; then
          echo "ANDROID SDK CACHE: already warm - nothing to upload"
          exit 0
        fi
        tar -czf /workspace/sdk.tgz -C /workspace android-sdk \
          && gcloud storage cp /workspace/sdk.tgz "gs://${_BUILD_CACHE_BUCKET}/${_ANDROID_SDK_CACHE_KEY}" \
          && echo "ANDROID SDK CACHE: SAVED for the next build" \
          || echo "could not write the cache (bucket missing or no permission) — builds still work, just slower"
        exit 0

  # -----------------------------
  # Pull previous image (for cache)
  # -----------------------------
  - name: gcr.io/cloud-builders/docker
    id: Pull
    entrypoint: /bin/bash
    waitFor: ['-']
    args:
      - -c
      - |
        IMG=$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME
        # Both tags seed --cache-from in the Build step. Either can be absent
        # (first run after this change, or a pruned registry) without harm.
        docker pull "$$IMG:builder" || true
        docker pull "$$IMG:latest" || true
        exit 0

  # -----------------------------
  # Build image (BuildKit enabled)
  # -----------------------------
  - name: gcr.io/cloud-builders/docker
    id: Build
    waitFor: ['Pull']
    entrypoint: /bin/bash
    env:
      - DOCKER_BUILDKIT=1
    args:
      - -c
      - |
        set -euo pipefail
        IMG=$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME

        # Export the builder stage as its own tag before building the runtime
        # image. This is the part that makes caching work at all: inline cache
        # records only layers belonging to an exported image ("min" mode), so
        # in a multi-stage build the builder's bundle install and
        # assets:precompile are invisible to --cache-from unless the stage is
        # exported like this. Caching against :latest alone -- which is what
        # this step used to do, and without BUILDKIT_INLINE_CACHE at that --
        # could never reuse them, so every build reinstalled every gem.
        #
        # Cost of the trade: :builder is a second image in Artifact Registry
        # (build-essential, libpq-dev, the full bundle). Layers are shared and
        # only changed ones upload, but it is not free -- a registry cleanup
        # policy on that tag is worth having.
        docker build \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          --cache-from "$$IMG:builder" \
          --target builder \
          -t "$$IMG:builder" \
          -f Dockerfile .

        # Reuses the builder layers resolved above, so this pass is only the
        # runtime stage.
        docker build \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          --cache-from "$$IMG:builder" \
          --cache-from "$$IMG:latest" \
          -t "$$IMG:$COMMIT_SHA" \
          -t "$$IMG:latest" \
          -f Dockerfile .

  # -----------------------------
  # Push image
  # -----------------------------
  - name: gcr.io/cloud-builders/docker
    id: Push
    waitFor: ['Build']
    args:
      - push
      - --all-tags
      - $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME

  # -----------------------------
  # Run database migrations
  # -----------------------------
  # Gated on AndroidCompile as well as Push: nothing reaches the database or the
  # running service until the Kotlin type-checks.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: Migrate
    waitFor: ['Push', 'AndroidCompile']
    entrypoint: /bin/bash
    args:
      - -c
      - |
        # Without this the step's status is just the LAST command's. A failed
        # 'jobs deploy' would be swallowed, 'jobs execute' would then run the
        # PREVIOUS build's job definition (old image, migrations already
        # applied, exits 0), and Deploy would ship new code against a schema
        # missing this commit's migrations.
        set -euo pipefail

        gcloud run jobs deploy ${_SERVICE_NAME}-migrate \
          --image=$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA \
          --region=$_DEPLOY_REGION \
          --service-account=${_RUNTIME_SERVICE_ACCOUNT} \
          --command=/app/bin/deploy-migrate \
          --args=exec,rails,db:migrate \
          --max-retries=0 \
          --parallelism=1 \
          --tasks=1 \
          --task-timeout=900s \
          --set-env-vars=RAILS_ENV=production,RAILS_SERVE_STATIC_FILES=true,APP_URL=${_APP_URL},MAILER_FROM=${_MAILER_FROM},FIREBASE_API_KEY=${_FIREBASE_API_KEY},FIREBASE_AUTH_DOMAIN=${_FIREBASE_AUTH_DOMAIN},FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID},FIREBASE_STORAGE_BUCKET=${_FIREBASE_STORAGE_BUCKET},FIREBASE_MESSAGING_SENDER_ID=${_FIREBASE_MESSAGING_SENDER_ID},FIREBASE_APP_ID=${_FIREBASE_APP_ID},FIREBASE_MEASUREMENT_ID=${_FIREBASE_MEASUREMENT_ID},FIREBASE_WEB_VAPID_KEY=${_FIREBASE_WEB_VAPID_KEY},PLATE_RECOGNIZER_REGION=${_PLATE_RECOGNIZER_REGION},PLATE_RECOGNIZER_API_URL=${_PLATE_RECOGNIZER_API_URL},ACTIVE_STORAGE_SERVICE=${_ACTIVE_STORAGE_SERVICE},GCS_PROJECT=${_GCS_PROJECT},GCS_BUCKET=${_GCS_BUCKET},RELEASE_SHA=$COMMIT_SHA \
          --set-secrets=SECRET_KEY_BASE=fuel-loyalty-secret-key-base:latest,DATABASE_URL=fuel-loyalty-database-url:latest,ADMIN_NOTIFICATION_API_TOKEN=fuel-loyalty-admin-notification-api-token:latest,PLATE_RECOGNIZER_API_TOKEN=fuel-loyalty-plate-recognizer-api-token:latest,AR_ENCRYPTION_PRIMARY_KEY=fuel-loyalty-ar-encryption-primary-key:latest,AR_ENCRYPTION_DETERMINISTIC_KEY=fuel-loyalty-ar-encryption-deterministic-key:latest,AR_ENCRYPTION_KEY_DERIVATION_SALT=fuel-loyalty-ar-encryption-key-derivation-salt:latest \
          --quiet

        gcloud run jobs execute ${_SERVICE_NAME}-migrate \
          --region=$_DEPLOY_REGION \
          --wait \
          --quiet

  # -----------------------------
  # Deploy to Cloud Run
  # -----------------------------
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: Deploy
    waitFor: ['Migrate']
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - $_SERVICE_NAME
      - --image=$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
      - --region=$_DEPLOY_REGION
      - --platform=managed
      - --service-account=$_RUNTIME_SERVICE_ACCOUNT
      - --quiet

      # Runtime configuration (non-secret env vars)
      - --set-env-vars=RAILS_ENV=production,RAILS_SERVE_STATIC_FILES=true,APP_URL=${_APP_URL},MAILER_FROM=${_MAILER_FROM},FIREBASE_API_KEY=${_FIREBASE_API_KEY},FIREBASE_AUTH_DOMAIN=${_FIREBASE_AUTH_DOMAIN},FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID},FIREBASE_STORAGE_BUCKET=${_FIREBASE_STORAGE_BUCKET},FIREBASE_MESSAGING_SENDER_ID=${_FIREBASE_MESSAGING_SENDER_ID},FIREBASE_APP_ID=${_FIREBASE_APP_ID},FIREBASE_MEASUREMENT_ID=${_FIREBASE_MEASUREMENT_ID},FIREBASE_WEB_VAPID_KEY=${_FIREBASE_WEB_VAPID_KEY},PLATE_RECOGNIZER_REGION=${_PLATE_RECOGNIZER_REGION},PLATE_RECOGNIZER_API_URL=${_PLATE_RECOGNIZER_API_URL},ACTIVE_STORAGE_SERVICE=${_ACTIVE_STORAGE_SERVICE},GCS_PROJECT=${_GCS_PROJECT},GCS_BUCKET=${_GCS_BUCKET},RELEASE_SHA=$COMMIT_SHA

      # Secrets sourced from Secret Manager (values never appear in this file or build logs).
      # The AR_ENCRYPTION_* keys back A7 Aadhaar-at-rest — the app FAILS TO BOOT
      # without them, so create them (scripts/setup-encryption-keys.sh) before the
      # first deploy that includes the A7 encryption initializer.
      - --set-secrets=SECRET_KEY_BASE=fuel-loyalty-secret-key-base:latest,DATABASE_URL=fuel-loyalty-database-url:latest,ADMIN_NOTIFICATION_API_TOKEN=fuel-loyalty-admin-notification-api-token:latest,PLATE_RECOGNIZER_API_TOKEN=fuel-loyalty-plate-recognizer-api-token:latest,AR_ENCRYPTION_PRIMARY_KEY=fuel-loyalty-ar-encryption-primary-key:latest,AR_ENCRYPTION_DETERMINISTIC_KEY=fuel-loyalty-ar-encryption-deterministic-key:latest,AR_ENCRYPTION_KEY_DERIVATION_SALT=fuel-loyalty-ar-encryption-key-derivation-salt:latest


      # Labels (traceability)
      - --update-labels=managed-by=gcp-cloud-build-deploy-cloud-run,gcb-trigger-id=$_TRIGGER_ID,gcb-trigger-region=$LOCATION,commit-sha=$COMMIT_SHA,gcb-build-id=$BUILD_ID

images:
  - $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
  - $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:latest

options:
  requestedVerifyOption: VERIFIED
  substitutionOption: ALLOW_LOOSE
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _TRIGGER_ID: ad281931-7075-4970-a527-68cd5ab9de7f

  # Android SDK build cache. The BuildCacheBucket step creates this bucket on
  # first use, so nothing has to be provisioned by hand; scripts/setup-build-cache.sh
  # remains for the case where the build service account lacks bucket-create
  # permission. The key names the exact package set, so bumping a package below
  # invalidates the cache rather than silently reusing the wrong SDK.
  _BUILD_CACHE_BUCKET: 'fuel-loyalty-build-cache'
  _ANDROID_SDK_CACHE_KEY: 'android-sdk-clt11076708-p36-bt36.0.0.tgz'

  _DEPLOY_REGION: us-central1
  _AR_HOSTNAME: us-central1-docker.pkg.dev
  _AR_REPOSITORY: cloud-run-source-deploy
  _AR_PROJECT_ID: thoughtbasics
  _SERVICE_NAME: fuel-loyalty-git
  REPO_NAME: achalbi-fuel-loyalty
  _APP_URL: 'https://fly.thoughtbasics.com'
  _MAILER_FROM: 'no-reply@fly.thoughtbasics.com'
  _FIREBASE_API_KEY: 'AIzaSyD2GOiEjnrGWDPQt1chym04qtmQ3F5LCEQ'
  _FIREBASE_AUTH_DOMAIN: 'fuel-loyalty.firebaseapp.com'
  _FIREBASE_PROJECT_ID: 'fuel-loyalty'
  _FIREBASE_STORAGE_BUCKET: 'fuel-loyalty.firebasestorage.app'
  _FIREBASE_MESSAGING_SENDER_ID: '629935221011'
  _FIREBASE_APP_ID: '1:629935221011:web:612bdd301126b28e8492e6'
  _FIREBASE_MEASUREMENT_ID: 'G-K2Q0927ZJX'
  _FIREBASE_WEB_VAPID_KEY: 'BM7ZYF-Ye-YL6sc9q7Te0wPoB_QMeTKrg_FCS6zoESZnK-3m8hRcT333tC-gC17dx3Yzfo5B-4XYU-NE1WIsVoE'
  _PLATE_RECOGNIZER_REGION: 'in'
  _PLATE_RECOGNIZER_API_URL: 'https://api.platerecognizer.com/v1/plate-reader/'

  # A7 durable KYC storage. Defaults keep uploads on the ephemeral local disk so a
  # deploy still boots before GCS is provisioned. After running
  # scripts/setup-gcs.sh, flip _ACTIVE_STORAGE_SERVICE to 'google' and set
  # _GCS_BUCKET so operator KYC images survive Cloud Run restarts.
  _ACTIVE_STORAGE_SERVICE: 'google'
  _GCS_PROJECT: 'thoughtbasics'
  _GCS_BUCKET: 'fuel-loyalty-uploads'

  # Secrets (SECRET_KEY_BASE, DATABASE_URL, ADMIN_NOTIFICATION_API_TOKEN,
  # PLATE_RECOGNIZER_API_TOKEN) are NOT stored here. They live in Secret Manager
  # and are mounted at runtime via --set-secrets in the Migrate and Deploy steps.
  # See scripts/setup-secrets.sh to create/rotate them.

tags:
  - gcp-cloud-build-deploy-cloud-run
  - fuel-loyalty-git
