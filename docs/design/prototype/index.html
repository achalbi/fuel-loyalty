<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nayara Fuel Loyalty — Native Prototype &amp; Component Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   NAYARA DESIGN TOKENS  — mirrored 1:1 from docs/design/tokens.css
   The prototype is token-driven: nothing below hardcodes a hex outside :root.
   ========================================================================== */
:root {
  --navy-50:#f1fbff; --navy-100:#e0f2ff; --navy-200:#c0e1ff; --navy-300:#9bcbff;
  --navy-400:#70aef9; --navy-500:#4c94e9; --navy-600:#327bce; --navy-700:#1d63b0;
  --navy-800:#0f4f93; --navy-900:#10447c; --navy-950:#052b54;
  --cyan-600:#0080a0; --cyan-900:#00465c; --cyan-100:#def4fd; --cyan-950:#003141;
  --green-600:#18945c; --green-700:#007845; --green-100:#dff7e7;
  --sky-300:#8fd0ff; --sky-500:#249adf; --sky-600:#0082c6;
  --amber-400:#f5a524; --amber-500:#cd7e00; --amber-700:#8e5400;
  --red-600:#df2935;
  --neutral-50:#f9fafc; --neutral-100:#f1f3f5; --neutral-200:#e2e5e9;
  --neutral-300:#d0d4d9; --neutral-400:#a7acb2; --neutral-500:#838990;
  --neutral-600:#636a71; --neutral-800:#373e46; --neutral-950:#111820;

  /* semantic — light */
  --bg-canvas:#f9fafc; --bg-surface:#ffffff; --bg-surfaceRaised:#ffffff;
  --bg-surfaceSunken:#f1f3f5; --bg-brand:#10447c; --bg-brandSubtle:#f1fbff; --bg-inverse:#111820;
  --text-primary:#111820; --text-secondary:#636a71; --text-tertiary:#838990;
  --text-disabled:#a7acb2; --text-inverse:#ffffff; --text-onBrand:#ffffff;
  --text-brand:#1d63b0; --text-link:#006aa8;
  --border-subtle:#f1f3f5; --border-default:#e2e5e9; --border-strong:#d0d4d9; --border-focus:#249adf;
  --action-primary:#1d63b0; --action-primaryHover:#0f4f93; --action-primaryPressed:#10447c;
  --action-onPrimary:#ffffff; --action-primaryContainer:#e0f2ff; --action-onPrimaryContainer:#10447c;
  --action-secondary:#f1fbff; --action-onSecondary:#0f4f93;
  --action-disabledBg:#e2e5e9; --action-onDisabled:#a7acb2;
  --accent-default:#0080a0; --accent-onAccent:#ffffff; --accent-container:#def4fd; --accent-onContainer:#00465c;
  --status-success:#18945c; --status-successText:#007845; --status-successContainer:#dff7e7; --status-onSuccessContainer:#004d28;
  --status-warning:#cd7e00; --status-warningText:#744300; --status-warningContainer:#ffeccf;
  --status-error:#df2935; --status-errorText:#df2935; --status-errorContainer:#ffe5e2;
  --status-info:#0082c6; --status-infoContainer:#dcf4ff;
  --reward-points:#cd7e00; --reward-pointsText:#744300; --reward-pointsContainer:#fff8e8; --reward-coin:#f5a524;
  --fuel-petrol:#18945c; --fuel-diesel:#1d63b0; --fuel-premium:#ad6900;
  --tier-member:#249adf; --tier-silver:#a7acb2; --tier-gold:#f5a524; --tier-platinum:#373e46;
  --overlay-scrim:rgba(8,15,24,0.60); --overlay-pressed:rgba(17,24,32,0.08);
  --gradient-brand-ribbon:linear-gradient(135deg,#10447c 0%,#0080a0 55%,#18945c 100%);
  --gradient-hero-card:linear-gradient(160deg,#052b54 0%,#10447c 55%,#00465c 100%);
  --gradient-gold-shine:linear-gradient(120deg,#f8ba69 0%,#f5a524 45%,#cd7e00 100%);

  --space-xs:4px; --space-sm:8px; --space-md:12px; --space-lg:16px; --space-xl:20px;
  --space-xxl:24px; --space-x3l:32px;
  --radius-xs:6px; --radius-sm:10px; --radius-md:14px; --radius-lg:18px; --radius-xl:22px;
  --radius-xxl:28px; --radius-full:999px;
  --size-hit-target:48px; --size-button-lg:52px; --size-input-height:52px;
  --size-tab-bar-height:64px; --size-list-row:56px; --size-list-row-lg:72px;
  --layout-screen-margin:16px; --layout-gutter:12px; --layout-card-padding:20px;
  --duration-instant:80ms; --duration-fast:140ms; --duration-base:220ms;
  --duration-gentle:320ms; --duration-slow:480ms;
  --easing-standard:cubic-bezier(0.2,0,0,1);
  --easing-emphasized:cubic-bezier(0.05,0.7,0.1,1);
  --shadow-e1:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.10);
  --shadow-e2:0 2px 4px -1px rgba(16,24,40,.06),0 4px 8px -2px rgba(16,24,40,.10);
  --shadow-e3:0 4px 6px -2px rgba(16,24,40,.05),0 8px 16px -4px rgba(16,24,40,.12);
  --shadow-e4:0 16px 32px -8px rgba(16,24,40,.16);
  --font-display:'Manrope',system-ui,sans-serif;
  --font-body:'Manrope',system-ui,-apple-system,sans-serif;
  --font-mono:'Roboto Mono',ui-monospace,monospace;
}
/* semantic — dark. Applied to the phone frame, not the chrome. */
[data-theme="dark"] {
  --bg-canvas:#080f18; --bg-surface:#0f1822; --bg-surfaceRaised:#18212d;
  --bg-surfaceSunken:#050a10; --bg-brandSubtle:#0d2038; --bg-inverse:#f9fafc;
  --text-primary:#f4f7fc; --text-secondary:#d0d4d9; --text-tertiary:#a7acb2;
  --text-disabled:#636a71; --text-inverse:#111820; --text-brand:#8fd0ff; --text-link:#8fd0ff;
  --border-subtle:#18212d; --border-default:#232932; --border-strong:#373e46; --border-focus:#8fd0ff;
  --action-primary:#8fd0ff; --action-onPrimary:#052b54;
  --action-primaryContainer:#00558c; --action-onPrimaryContainer:#dcf4ff;
  --action-secondary:#0d2038; --action-onSecondary:#9bcbff;
  --action-disabledBg:#232932; --action-onDisabled:#636a71;
  --accent-default:#66b7d4; --accent-onAccent:#003141; --accent-container:#00465c; --accent-onContainer:#def4fd;
  --status-success:#67c18e; --status-successText:#97d9b1; --status-successContainer:#004d28;
  --status-warning:#f5a524; --status-warningText:#f8ba69; --status-warningContainer:#5d3300;
  --status-error:#ff746f; --status-errorText:#ffa8a1; --status-errorContainer:#7e000b;
  --reward-points:#f5a524; --reward-pointsText:#ffd6a1; --reward-pointsContainer:#432200;
  --fuel-petrol:#67c18e; --fuel-diesel:#70aef9; --fuel-premium:#f8ba69;
  /* no shadows in dark — borders instead (DESIGN_BRIEF §7) */
  --shadow-e1:none; --shadow-e2:none; --shadow-e3:none; --shadow-e4:none;
}

/* ========================= chrome ========================= */
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:var(--font-body);background:#eef1f5;color:var(--neutral-950);
  -webkit-font-smoothing:antialiased;
}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.sidebar{
  background:#0b1520;color:#dfe6ee;padding:22px 16px;position:sticky;top:0;height:100vh;
  overflow-y:auto;border-right:1px solid #1b2734;
}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--gradient-brand-ribbon)}
.brand h1{font-size:15px;font-weight:800;letter-spacing:-.2px}
.brand-sub{font-size:11px;color:#7d8b9b;margin:0 0 22px 40px;font-weight:500}
.navgroup{margin-bottom:18px}
.navgroup-title{font-size:10px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:#5d6c7c;margin:0 0 8px 8px}
.navlink{
  display:flex;align-items:center;gap:9px;width:100%;padding:9px 10px;border:0;border-radius:9px;
  background:transparent;color:#b9c5d2;font:inherit;font-size:13px;font-weight:600;cursor:pointer;text-align:left;
  transition:background var(--duration-fast) var(--easing-standard),color var(--duration-fast);
}
.navlink:hover{background:#16222f;color:#fff}
.navlink[aria-current="true"]{background:var(--navy-700);color:#fff}
.navlink .dot{width:7px;height:7px;border-radius:99px;flex:none}
.controls{border-top:1px solid #1b2734;padding-top:16px;margin-top:8px}
.ctrl{margin-bottom:14px}
.ctrl label{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:#5d6c7c;margin-bottom:7px}
.seg{display:flex;background:#16222f;border-radius:9px;padding:3px;gap:3px}
.seg button{
  flex:1;border:0;background:transparent;color:#8d9bab;font:inherit;font-size:12px;font-weight:700;
  padding:6px;border-radius:6px;cursor:pointer;transition:all var(--duration-fast)
}
.seg button[aria-pressed="true"]{background:var(--navy-700);color:#fff}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatch{width:26px;height:26px;border-radius:7px;border:2px solid transparent;cursor:pointer;padding:0}
.swatch[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 2px var(--navy-700)}
.hint{font-size:10.5px;color:#5d6c7c;line-height:1.5;margin-top:4px}

.main{padding:28px 32px 64px;overflow-x:hidden}
.page-head{max-width:1180px;margin:0 0 22px}
.page-head h2{font-size:24px;font-weight:800;letter-spacing:-.4px;color:#0b1520}
.page-head p{font-size:13.5px;color:#5c6773;margin-top:6px;line-height:1.6;max-width:760px}
.badge-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.badge{
  font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:999px;letter-spacing:.2px;
  background:#e3e8ee;color:#4a5560
}
.badge.new{background:var(--green-100);color:var(--green-700)}
.badge.have{background:var(--navy-100);color:var(--navy-800)}
.badge.api{background:#e9e4f5;color:#5b4b8a;font-family:var(--font-mono);font-size:10px}

/* ===== phone frame ===== */
.deck{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start}
.phone-wrap{display:flex;flex-direction:column;gap:10px;align-items:center}
.phone{
  width:340px;height:722px;border-radius:38px;background:var(--bg-canvas);
  border:9px solid #0b1520;box-shadow:0 22px 50px -14px rgba(11,21,32,.4);
  position:relative;overflow:hidden;display:flex;flex-direction:column;
  font-family:var(--font-body);color:var(--text-primary);
}
.phone::before{
  content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:112px;height:22px;background:#0b1520;border-radius:0 0 14px 14px;z-index:60
}
.phone-label{font-size:12px;font-weight:700;color:#4a5560}
.phone-label span{color:#8b96a2;font-weight:500}
.statusbar{
  height:30px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 20px 3px;font-size:11px;font-weight:700;color:var(--text-primary);z-index:5
}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.pad{padding:0 var(--layout-screen-margin)}

/* ===== NAYARA COMPONENTS (the actual design system, in HTML) ===== */
.appbar{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:8px var(--layout-screen-margin) 12px;position:sticky;top:0;z-index:10;
  background:var(--bg-canvas)
}
.appbar .t{font-size:17px;font-weight:700;line-height:24px}
.appbar .s{font-size:12px;color:var(--text-secondary);font-weight:500}
.iconbtn{
  width:40px;height:40px;border-radius:999px;border:0;background:transparent;color:var(--text-secondary);
  display:grid;place-items:center;cursor:pointer
}
.iconbtn:hover{background:var(--overlay-pressed)}

.avatar{
  width:36px;height:36px;border-radius:999px;background:var(--action-primaryContainer);
  color:var(--action-onPrimaryContainer);display:grid;place-items:center;
  font-weight:800;font-size:14px;flex:none
}
.avatar.lg{width:56px;height:56px;font-size:20px}

.card{
  background:var(--bg-surface);border-radius:var(--radius-lg);padding:var(--layout-card-padding);
  box-shadow:var(--shadow-e1);border:1px solid transparent
}
[data-theme="dark"] .card{border-color:var(--border-default)}

.hero{
  position:relative;border-radius:var(--radius-lg);background:var(--gradient-hero-card);
  padding:var(--layout-card-padding);color:#fff;overflow:hidden
}
.hero .ribbon{position:absolute;top:0;left:0;right:0;height:3px;background:var(--gradient-brand-ribbon)}
.hero .lbl{font-size:12px;font-weight:600;color:rgba(255,255,255,.72);letter-spacing:.3px}
.hero-cols{display:flex;gap:var(--space-xxl);margin-top:14px}
.hero-col .n{font-size:28px;font-weight:800;line-height:32px;letter-spacing:-.25px;font-variant-numeric:tabular-nums}
.hero-col .c{font-size:11px;color:rgba(255,255,255,.65);font-weight:600;margin-top:2px}

.num-hero{font-size:44px;line-height:48px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.num-lg{font-size:28px;line-height:32px;font-weight:800;letter-spacing:-.25px;font-variant-numeric:tabular-nums}
.num{font-size:20px;line-height:24px;font-weight:700;font-variant-numeric:tabular-nums}

.btn{
  height:var(--size-button-lg);border-radius:var(--radius-md);border:0;width:100%;
  font:inherit;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;
  justify-content:center;gap:8px;transition:transform var(--duration-fast) var(--easing-standard),filter var(--duration-fast)
}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--action-primary);color:var(--action-onPrimary)}
.btn-tonal{background:var(--action-secondary);color:var(--action-onSecondary)}
.btn-outline{background:transparent;color:var(--action-primary);border:1px solid var(--border-strong)}
.btn-danger{background:var(--status-error);color:#fff}
.btn:disabled{background:var(--action-disabledBg);color:var(--action-onDisabled);cursor:not-allowed}
.btn-sm{height:36px;font-size:13px;padding:0 14px;width:auto}
.btn-md{height:44px;font-size:14px;width:auto;padding:0 18px}

.field{margin-bottom:var(--space-md)}
.field label{display:block;font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:6px}
.input{
  width:100%;height:var(--size-input-height);border-radius:var(--radius-md);
  background:var(--bg-surface);border:1px solid var(--border-default);
  padding:0 14px;font:inherit;font-size:15px;font-weight:600;color:var(--text-primary);
  transition:border-color var(--duration-fast),box-shadow var(--duration-fast)
}
.input::placeholder{color:var(--text-disabled);font-weight:500}
.input:focus{outline:0;border-color:var(--border-focus);box-shadow:0 0 0 1px var(--border-focus)}
.input.err{border-color:var(--status-error)}
.helper{font-size:12px;color:var(--text-tertiary);margin-top:6px}
.helper.err{color:var(--status-errorText);font-weight:600}
.prefix-wrap{display:flex;align-items:center;gap:0}
.prefix{
  height:var(--size-input-height);display:grid;place-items:center;padding:0 12px;
  background:var(--bg-surfaceSunken);border:1px solid var(--border-default);border-right:0;
  border-radius:var(--radius-md) 0 0 var(--radius-md);font-size:15px;font-weight:700;color:var(--text-secondary)
}
.prefix + .input{border-radius:0 var(--radius-md) var(--radius-md) 0}

.chip{
  display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:var(--radius-full);
  border:1px solid var(--border-default);background:transparent;color:var(--text-secondary);
  font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;
  transition:all var(--duration-fast) var(--easing-standard)
}
.chip[aria-pressed="true"]{background:var(--accent-container);color:var(--accent-onContainer);border-color:transparent}
.chip.petrol[aria-pressed="true"]{background:var(--fuel-petrol);color:#fff}
.chip.diesel[aria-pressed="true"]{background:var(--fuel-diesel);color:#fff}
.chip.premium[aria-pressed="true"]{background:var(--fuel-premium);color:#fff}
.chip .swatch-dot{width:8px;height:8px;border-radius:99px}

.status-chip{
  display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:var(--radius-full);
  font-size:11px;font-weight:700;letter-spacing:.2px
}
.sc-success{background:var(--status-successContainer);color:var(--status-onSuccessContainer)}
.sc-warning{background:var(--status-warningContainer);color:var(--status-warningText)}
.sc-error{background:var(--status-errorContainer);color:var(--status-error)}
.sc-neutral{background:var(--bg-surfaceSunken);color:var(--text-secondary)}
.sc-info{background:var(--status-infoContainer);color:var(--accent-onContainer)}

.plate{
  display:inline-flex;align-items:center;height:26px;padding:0 8px;border-radius:var(--radius-xs);
  background:var(--bg-surfaceSunken);border:1px solid var(--border-default);
  font-family:var(--font-mono);font-size:12.5px;font-weight:700;letter-spacing:.5px;color:var(--text-primary)
}
.plate.lg{height:34px;font-size:15px;padding:0 11px}

.pill{
  display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px 0 8px;border-radius:var(--radius-full);
  background:var(--reward-pointsContainer);color:var(--reward-pointsText);font-weight:800;font-size:14px;
  font-variant-numeric:tabular-nums
}
.coin{width:16px;height:16px;border-radius:99px;background:var(--reward-coin);display:grid;place-items:center;
  font-size:9px;color:#fff;font-weight:800;flex:none}

.tier{
  display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:var(--radius-full);
  font-size:11px;font-weight:800;letter-spacing:.3px;color:#fff;text-transform:uppercase
}
.tier-member{background:var(--tier-member)}
.tier-silver{background:var(--tier-silver);color:var(--neutral-950)}
.tier-gold{background:var(--gradient-gold-shine);color:var(--neutral-950)}
.tier-platinum{background:var(--tier-platinum)}

.row{
  display:flex;align-items:center;gap:12px;min-height:var(--size-list-row-lg);
  padding:10px 0;border-bottom:1px solid var(--border-subtle);cursor:pointer
}
.row:last-child{border-bottom:0}
.row:hover{background:var(--overlay-pressed);margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:var(--radius-sm)}
.row-icon{
  width:44px;height:44px;border-radius:999px;display:grid;place-items:center;flex:none;font-size:18px
}
.ri-earn{background:var(--status-successContainer);color:var(--status-onSuccessContainer)}
.ri-redeem{background:var(--reward-pointsContainer);color:var(--reward-pointsText)}
.ri-adjust{background:var(--action-primaryContainer);color:var(--action-onPrimaryContainer)}
.row-main{flex:1;min-width:0}
.row-t{font-size:14.5px;font-weight:700;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-s{font-size:12px;color:var(--text-secondary);margin-top:3px;display:flex;align-items:center;gap:6px;font-weight:500}
.row-v{text-align:right;flex:none}
.row-v .amt{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;line-height:22px}
.amt-pos{color:var(--status-successText)}
.amt-neg{color:var(--text-primary)}
.row-v .sub{font-size:11px;color:var(--text-tertiary);margin-top:2px;font-weight:600}

.section-head{
  display:flex;align-items:center;justify-content:space-between;
  margin:24px 0 8px;
}
.section-head h3{font-size:12px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--text-tertiary)}
.section-head a{font-size:12.5px;font-weight:700;color:var(--text-link);text-decoration:none;cursor:pointer}

.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--layout-gutter)}
.quick{
  background:var(--bg-surface);border-radius:var(--radius-md);padding:12px 6px;text-align:center;
  border:1px solid var(--border-subtle);cursor:pointer;
  transition:transform var(--duration-fast) var(--easing-standard)
}
.quick:active{transform:scale(.97);background:var(--overlay-pressed)}
.quick .ic{
  width:44px;height:44px;margin:0 auto 7px;border-radius:999px;display:grid;place-items:center;
  background:var(--action-primaryContainer);color:var(--action-onPrimaryContainer);font-size:19px
}
.quick .lb{font-size:11px;font-weight:700;color:var(--text-secondary);line-height:14px}

/* metric card — admin */
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:var(--layout-gutter)}
.metric{
  background:var(--bg-surface);border-radius:var(--radius-lg);padding:14px;
  box-shadow:var(--shadow-e1);border:1px solid transparent
}
[data-theme="dark"] .metric{border-color:var(--border-default)}
.metric .k{font-size:11px;font-weight:700;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.5px}
.metric .v{font-size:24px;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.metric .d{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:800;margin-top:5px}
.d-up{color:var(--status-successText)}
.d-down{color:var(--status-error)}
.d-flat{color:var(--text-tertiary)}

/* tab bar + scan FAB */
.tabbar{
  flex:none;height:var(--size-tab-bar-height);background:var(--bg-surface);
  border-top:1px solid var(--border-subtle);display:grid;grid-template-columns:repeat(5,1fr);
  align-items:center;position:relative;z-index:20;padding-bottom:2px
}
.tab{
  border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;
  cursor:pointer;color:var(--text-tertiary);font:inherit;padding:6px 0;position:relative
}
.tab .ti{font-size:19px;line-height:20px}
.tab .tl{font-size:10px;font-weight:700}
.tab[aria-current="true"]{color:var(--action-primary)}
.tab[aria-current="true"]::after{
  content:"";position:absolute;bottom:1px;width:4px;height:4px;border-radius:99px;background:var(--action-primary)
}
.tab.center{visibility:hidden}
.fab{
  position:absolute;left:50%;bottom:26px;transform:translateX(-50%);
  width:64px;height:64px;border-radius:999px;border:0;cursor:pointer;z-index:30;
  background:var(--gradient-brand-ribbon);padding:3px;
  box-shadow:var(--shadow-e3);
  transition:transform var(--duration-fast) var(--easing-standard)
}
.fab:active{transform:translateX(-50%) scale(.95)}
.fab-inner{
  width:100%;height:100%;border-radius:999px;background:var(--bg-brand);color:#fff;
  display:grid;place-items:center;font-size:24px
}
[data-theme="dark"] .fab-inner{background:var(--bg-surfaceRaised)}

/* sticky bottom action bar */
.actionbar{
  flex:none;background:var(--bg-surface);box-shadow:var(--shadow-e3);
  border-top:1px solid var(--border-subtle);
  padding:12px var(--layout-screen-margin) 16px;display:flex;gap:10px;z-index:20
}

/* bottom sheet */
.sheet-scrim{
  position:absolute;inset:0;background:var(--overlay-scrim);z-index:40;
  display:flex;align-items:flex-end;animation:fade var(--duration-base) var(--easing-standard)
}
.sheet{
  width:100%;background:var(--bg-surface);border-radius:var(--radius-xxl) var(--radius-xxl) 0 0;
  padding:10px var(--layout-screen-margin) 20px;max-height:88%;overflow-y:auto;
  animation:rise var(--duration-gentle) var(--easing-emphasized);scrollbar-width:none
}
.sheet::-webkit-scrollbar{display:none}
.handle{width:36px;height:4px;border-radius:99px;background:var(--border-strong);margin:0 auto 14px}
.sheet h4{font-size:20px;font-weight:800;letter-spacing:-.2px;margin-bottom:4px}
.sheet .sub{font-size:13px;color:var(--text-secondary);margin-bottom:16px;font-weight:500}
@keyframes rise{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* numeric keypad */
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.key{
  height:56px;border-radius:var(--radius-md);border:1px solid var(--border-subtle);
  background:var(--bg-surface);color:var(--text-primary);font:inherit;font-size:22px;font-weight:700;
  cursor:pointer;font-variant-numeric:tabular-nums;
  transition:background var(--duration-instant),transform var(--duration-fast) var(--easing-standard)
}
.key:active{transform:scale(.96);background:var(--action-primaryContainer)}
.key.util{background:var(--bg-surfaceSunken);font-size:17px;color:var(--text-secondary)}
.amount-display{
  text-align:center;padding:14px 0 6px
}
.amount-display .rs{font-size:44px;font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.amount-display .rs .cur{color:var(--text-tertiary);font-weight:700}
.convert{
  display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:700;
  color:var(--text-secondary);padding:10px;background:var(--bg-surfaceSunken);
  border-radius:var(--radius-md);margin-top:12px
}
.convert b{color:var(--status-successText);font-size:17px;font-variant-numeric:tabular-nums}

/* segmented control */
.segmented{
  display:flex;background:var(--bg-surfaceSunken);border-radius:var(--radius-md);padding:4px;gap:4px
}
.segmented button{
  flex:1;border:0;background:transparent;color:var(--text-secondary);font:inherit;font-size:13px;
  font-weight:700;height:40px;border-radius:var(--radius-sm);cursor:pointer;
  transition:all var(--duration-fast) var(--easing-standard)
}
.segmented button[aria-pressed="true"]{background:var(--bg-surface);color:var(--action-primary);box-shadow:var(--shadow-e1)}

/* progress / tier ring */
.progress{height:8px;border-radius:99px;background:var(--border-subtle);overflow:hidden}
.progress > i{display:block;height:100%;border-radius:99px;background:var(--accent-default);
  transition:width var(--duration-slow) var(--easing-emphasized)}
.progress.gold > i{background:var(--gradient-gold-shine)}

/* banner */
.banner{
  display:flex;gap:10px;padding:12px 14px;border-radius:var(--radius-md);font-size:13px;
  font-weight:600;line-height:18px;align-items:flex-start
}
.banner .bi{flex:none;font-size:15px;line-height:18px}
.bn-info{background:var(--status-infoContainer);color:var(--accent-onContainer)}
.bn-warn{background:var(--status-warningContainer);color:var(--status-warningText)}
.bn-err{background:var(--status-errorContainer);color:var(--status-error)}
.bn-success{background:var(--status-successContainer);color:var(--status-onSuccessContainer)}

/* skeleton */
.sk{border-radius:var(--radius-sm);background:var(--bg-surfaceSunken);position:relative;overflow:hidden}
.sk::after{
  content:"";position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);
  animation:shimmer 1.1s linear infinite
}
[data-theme="dark"] .sk::after{background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent)}
@keyframes shimmer{to{transform:translateX(100%)}}

/* empty state */
.empty{text-align:center;padding:40px 20px}
.empty .ic{
  width:64px;height:64px;border-radius:999px;background:var(--accent-container);
  color:var(--accent-onContainer);display:grid;place-items:center;font-size:26px;margin:0 auto 14px
}
.empty h5{font-size:16px;font-weight:700;margin-bottom:5px}
.empty p{font-size:13px;color:var(--text-secondary);margin-bottom:16px;line-height:19px}

/* success overlay */
.success{
  position:absolute;inset:0;z-index:50;background:var(--bg-surface);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:30px;
  animation:fade var(--duration-base)
}
.tick{
  width:88px;height:88px;border-radius:999px;background:var(--status-successContainer);
  display:grid;place-items:center;margin-bottom:12px;
  animation:pop var(--duration-gentle) var(--easing-emphasized)
}
.tick.navy{background:var(--action-primaryContainer)}
.tick svg{width:44px;height:44px}
.tick path{stroke-dasharray:48;stroke-dashoffset:48;animation:draw var(--duration-gentle) var(--easing-emphasized) 120ms forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.success .msg{font-size:15px;font-weight:600;color:var(--text-secondary);text-align:center;line-height:21px}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;width:7px;height:11px;border-radius:2px;animation:fall 1.2s ease-in forwards}
@keyframes fall{
  0%{transform:translateY(-40px) rotate(0);opacity:1}
  100%{transform:translateY(560px) rotate(540deg);opacity:0}
}

/* hold to confirm */
.hold{position:relative;overflow:hidden}
.hold .fill{
  position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,255,255,.25);
  transition:width var(--duration-gentle) linear
}
.hold.holding .fill{width:100%}
.hold span{position:relative;z-index:1}

/* reward catalog grid */
.rewards{display:grid;grid-template-columns:1fr 1fr;gap:var(--layout-gutter)}
.reward{
  background:var(--bg-surface);border-radius:var(--radius-lg);padding:16px;cursor:pointer;
  box-shadow:var(--shadow-e1);border:1px solid transparent;position:relative;
  transition:transform var(--duration-fast) var(--easing-standard)
}
[data-theme="dark"] .reward{border-color:var(--border-default)}
.reward:active{transform:scale(.97)}
.reward[data-locked="true"]{opacity:.42}
.reward .val{font-size:22px;font-weight:800;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.reward .cost{font-size:12.5px;font-weight:800;color:var(--reward-pointsText);margin-top:6px}
.reward .lock{position:absolute;top:10px;right:10px;font-size:13px;color:var(--text-tertiary)}

/* day header */
.dayhead{
  font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--text-tertiary);
  padding:14px 0 6px;position:sticky;top:0;background:var(--bg-canvas);z-index:2
}

/* ===== gallery ===== */
.gallery{max-width:1180px}
.gsec{margin-bottom:34px}
.gsec > h3{
  font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#7a8794;
  padding-bottom:8px;border-bottom:1px solid #dbe1e8;margin-bottom:16px
}
.gitems{display:flex;flex-wrap:wrap;gap:16px}
.gitem{
  background:var(--bg-surface);border-radius:14px;padding:18px;border:1px solid #dfe4ea;
  box-shadow:0 1px 2px rgba(16,24,40,.04);min-width:200px
}
.gitem .gname{
  font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;color:#8b96a2;margin-bottom:12px;
  font-family:var(--font-mono)
}
.gitem .gbody{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.gitem .grow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.gitem.wide{width:100%;max-width:420px}

/* token table */
.ttable{width:100%;border-collapse:collapse;font-size:12.5px;background:#fff;border-radius:12px;overflow:hidden;
  box-shadow:0 1px 2px rgba(16,24,40,.06)}
.ttable th{
  text-align:left;padding:9px 12px;background:#f3f5f8;font-size:10.5px;text-transform:uppercase;
  letter-spacing:.7px;color:#7a8794;font-weight:800
}
.ttable td{padding:8px 12px;border-top:1px solid #edf0f3;vertical-align:middle}
.ttable code{font-family:var(--font-mono);font-size:11.5px;color:#4a5560}
.tsw{width:22px;height:22px;border-radius:6px;border:1px solid rgba(0,0,0,.08);display:inline-block;vertical-align:middle}

.callout{
  background:#fff;border-left:3px solid var(--navy-700);border-radius:0 10px 10px 0;padding:14px 16px;
  font-size:13px;line-height:1.6;color:#41505e;margin-bottom:16px;max-width:820px;
  box-shadow:0 1px 2px rgba(16,24,40,.05)
}
.callout b{color:#0b1520}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="app">
  <!-- ================= SIDEBAR ================= -->
  <aside class="sidebar">

      </div>

  </aside>

  <!-- ================= MAIN ================= -->

</div>

<script>

/* ---------- shared partials ---------- */

const tabbar = (active) => `

/* =========================================================================
   SCREENS
   ========================================================================= */
const SCREENS = {};

/* ---------- STAFF: HOME ---------- */
SCREENS['staff-home'] = {
  title:"Staff — Home (shift dashboard)",
  desc:"The single biggest IA gap today: the app currently navigates from menu cards with no persistent bottom bar. This is the brief's §4a IA — 4 destinations plus a docked SCAN FAB, so the highest-frequency action (plate → customer → award) is always one thumb-reach away.",

/* ---------- STAFF: AWARD (keypad sheet) ---------- */
SCREENS['staff-award'] = {
  title:"Staff — Award points (keypad sheet)",
  desc:"Brief §5.5. Amount entry is the hottest path in the app and today it's a plain text field. A keypad-first bottom sheet with a live ₹ → points conversion line means the attendant never leaves the sheet, never opens the soft keyboard, and sees the reward before committing. Tap CONFIRM to see the earn ceremony.",
  badges:[["NEW","new","NumericKeypad"],["NEW","new","AmountSheet + live conversion"],["NEW","new","NayaraBottomSheet"],["HAVE","have","SuccessOverlay"],["API","api","POST /api/v1/staff/transactions"]],
  html:()=>`
  ${statusbar()}

/* count-up numerals (brief §8: never jump-cut a number the user cares about) */
function countUp(){
  document.querySelectorAll('[data-count]').forEach(el=>{
    const target = +el.dataset.count, dur = 1100, t0 = performance.now();
    const tick = t => {
      const k = Math.min(1,(t-t0)/dur);
      const eased = 1 - Math.pow(1-k, 3);
      el.textContent = Math.round(target*eased).toLocaleString('en-IN');
      if(k<1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });
}

/* redeem stepper — locked to the increment the API enforces */
let redeem = 400;
const MAXR = 1200, INC = 100, CVP = 0.5;
function setRedeem(v){ redeem = v; paintRedeem(); }
function step(d){ redeem = Math.max(INC, Math.min(MAXR, redeem + d)); paintRedeem(); }
function paintRedeem(){
  document.getElementById('redeemPts').textContent = redeem.toLocaleString('en-IN');
  document.getElementById('redeemCash').textContent = '₹' + (redeem*CVP).toLocaleString('en-IN');
  document.getElementById('holdPts').textContent = redeem.toLocaleString('en-IN');
}

/* hold-to-confirm — 320ms Gentle sweep, then the navy/gold ceremony */
function wireHold(){
  const b = document.getElementById('holdBtn');
  if(!b) return;
  let t;
  const start = () => { b.classList.add('holding'); t = setTimeout(redeemDone, 700); };
  const stop  = () => { b.classList.remove('holding'); clearTimeout(t); };
  b.addEventListener('mousedown', start);
  b.addEventListener('touchstart', start);
  ['mouseup','mouseleave','touchend'].forEach(e => b.addEventListener(e, stop));
}
function redeemDone(){
  const scr = document.getElementById('redeemScreen');
  scr.insertAdjacentHTML('beforeend', `
    <div class="success">
      <div class="tick navy">
        <svg viewBox="0 0 48 48" fill="none">

      </div>

  countUp();
  setTimeout(()=>go('staff-profile'), 3200);
}

/* admin brand seed — mirrors BrandPalette.from(hex, dark): only primary slots move */
document.querySelectorAll('#seeds button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#seeds button').forEach(x => x.setAttribute('aria-pressed', x===b));
  const hex = b.dataset.seed;
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), bl = parseInt(hex.slice(5,7),16);
  const adj = (k) => '#' + [r,g,bl].map(c => {
    const v = k > 0 ? c + (255-c)*k : c * (1+k);
    return Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0');
  }).join('');
  const brightness = (r*299 + g*587 + bl*114)/1000;
  const contrast = brightness >= 150 ? '#052b54' : '#ffffff';
  const root = document.documentElement.style;
  root.setProperty('--action-primary', hex);
  root.setProperty('--action-onPrimary', contrast);
  root.setProperty('--action-primaryContainer', adj(0.86));
